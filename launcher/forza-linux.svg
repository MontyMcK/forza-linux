<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- forza-linux launcher icon: original artwork (sunset road), no game assets. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0c45"/>
      <stop offset="0.45" stop-color="#c2185b"/>
      <stop offset="0.72" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#ff9e1b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4a"/>
      <stop offset="1" stop-color="#14101c"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1747"/>
      <stop offset="1" stop-color="#1c0b24"/>
