      <rect x="60" y="140" width="136" height="7"/>
      <rect x="60" y="156" width="136" height="9"/>
    </g>
    <path d="M8 168 C 50 150, 84 156, 112 166 C 150 180, 196 150, 248 160 L 248 248 L 8 248 Z" fill="url(#hill)"/>
    <path d="M116 166 L 140 166 L 214 248 L 42 248 Z" fill="url(#road)"/>
    <path d="M126 170 L 130 170 L 132 184 L 124 184 Z" fill="#ffd166"/>
    <path d="M122 194 L 134 194 L 137 214 L 119 214 Z" fill="#ffd166"/>
    <path d="M116 226 L 140 226 L 144 248 L 112 248 Z" fill="#ffd166"/>
    <path d="M116 166 L 42 248" stroke="#ff9e1b" stroke-width="3" opacity="0.8"/>
    <path d="M140 166 L 214 248" stroke="#ff9e1b" stroke-width="3" opacity="0.8"/>
